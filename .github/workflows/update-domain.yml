name: Sync BestCF Sources

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download sources
        shell: bash
        run: |
          set -e

          mkdir -p /tmp/sources

          download() {
            name="$1"
            url="$2"

            echo "Downloading: $name"

            curl -L \
              --fail \
              --retry 3 \
              --connect-timeout 15 \
              --max-time 120 \
              "$url" \
              -o "/tmp/sources/$name.txt"

            if [ ! -s "/tmp/sources/$name.txt" ]; then
              echo "ERROR: empty source: $name"
              exit 1
            fi

            echo "Downloaded $(wc -l < "/tmp/sources/$name.txt") lines"
          }

          download "domain" \
            "https://bestcf.pages.dev/domain/all.txt"

          download "vps789" \
            "https://bestcf.pages.dev/vps789/top10.txt"

          download "qms" \
            "https://bestcf.pages.dev/domain/qms/all.txt"

          download "wetest" \
            "https://bestcf.pages.dev/wetest/ipv4.txt"

          download "xinyitang3" \
            "https://bestcf.pages.dev/xinyitang3/ipv4.txt"

          download "tiancheng" \
            "https://bestcf.pages.dev/tiancheng/all.txt"

          download "cmliu" \
            "https://bestcf.pages.dev/cmliu/all.txt"

          download "lzj" \
            "https://bestcf.pages.dev/lzj/all.txt"

          download "lajiao" \
            "https://bestcf.pages.dev/lajiao/all.txt"

      - name: Normalize sources
        shell: bash
        run: |
          set -e

          mkdir -p /tmp/normalized

          for file in /tmp/sources/*.txt; do
            name=$(basename "$file")

            echo "Normalize: $name"

            # CRLF -> LF
            tr -d '\r' < "$file" |

            # 每个地址强制独立一行
            sed -E 's/([0-9]{1,3}(\.[0-9]{1,3}){3}:[0-9]{1,5}#[^0-9[:space:]]+)/\1\n/g' |

            # 去除首尾空白
            sed 's/^[[:space:]]*//' |
            sed 's/[[:space:]]*$//' |

            # 删除空行
            sed '/^$/d' \
            > "/tmp/normalized/$name"
          done

      - name: Generate all.txt
        shell: bash
        run: |
          set -e

          mkdir -p domain

          cat /tmp/normalized/*.txt \
            | sed 's/\r//g' \
            | sed '/^[[:space:]]*$/d' \
            > /tmp/all.txt

          python3 <<'PY'
          import re

          src = "/tmp/all.txt"
          dst = "domain/all.txt"

          # 支持：
          # IP:443
          # IP:443#备注
          # domain.com:443
          # domain.com:443#备注

          pattern = re.compile(
              r'^([A-Za-z0-9.-]+):([0-9]{1,5})(?:#(.*))?$'
          )

          seen = set()
          result = []

          with open(src, "r", encoding="utf-8", errors="ignore") as f:

              for raw in f:

                  line = raw.strip()

                  if not line:
                      continue

                  # 删除 BOM
                  line = line.lstrip("\ufeff")

                  m = pattern.match(line)

                  if not m:
                      continue

                  host = m.group(1).lower()
                  port = m.group(2)
                  remark = (m.group(3) or "").strip()

                  # 地址 + 端口唯一
                  key = f"{host}:{port}"

                  if key in seen:
                      continue

                  seen.add(key)

                  if remark:
                      result.append(
                          f"{host}:{port}#{remark}"
                      )
                  else:
                      result.append(
                          f"{host}:{port}"
                      )

          with open(dst, "w", encoding="utf-8") as f:
              for line in result:
                  f.write(line + "\n")

          print("================================")
          print(f"Total unique entries: {len(result)}")
          print("================================")
          PY

      - name: Check result
        shell: bash
        run: |
          set -e

          total=$(grep -cve '^[[:space:]]*$' domain/all.txt || true)

          echo "Total: $total"

          if [ "$total" -lt 10 ]; then
            echo "ERROR: result contains too few entries"
            exit 1
          fi

          echo
          echo "First 20:"
          head -20 domain/all.txt

          echo
          echo "Last 20:"
          tail -20 domain/all.txt

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add domain/all.txt

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "chore: update domain list"
          git push
